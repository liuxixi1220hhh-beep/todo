<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办清单 — Todo</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#6366f1;--pd:#4f46e5;--pl:#eef2ff;--s:#10b981;--sl:#d1fae5;
  --d:#ef4444;--dl:#fee2e2;--w:#f59e0b;--wl:#fef3c7;
  --t:#1e293b;--ts:#64748b;--tm:#94a3b8;--b:#e2e8f0;--bg:#f1f5f9;--c:#fff;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shl:0 10px 25px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.04);
  --r:16px;--rs:10px;--rx:8px;--tr:.2s ease;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(150deg,#eef2ff 0%,#f5f7fa 35%,#faf5ff 70%,#eef2ff 100%);
  min-height:100vh;color:var(--t);line-height:1.5;-webkit-tap-highlight-color:transparent;
}
.hidden{display:none!important}

/* Auth */
.auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-card{background:var(--c);border-radius:var(--r);box-shadow:var(--shl);padding:36px 32px;width:100%;max-width:400px}
.auth-card h1{text-align:center;font-size:28px;margin-bottom:4px;background:linear-gradient(135deg,var(--p),#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-card .sub{text-align:center;color:var(--ts);font-size:14px;margin-bottom:24px}
.auth-tabs{display:flex;gap:0;margin-bottom:20px;border-radius:var(--rx);background:var(--bg);padding:4px}
.auth-tab{flex:1;text-align:center;padding:10px;border-radius:var(--rx);cursor:pointer;font-weight:500;font-size:14px;transition:var(--tr);color:var(--ts);border:none;background:none}
.auth-tab.active{background:var(--c);color:var(--p);box-shadow:var(--sh)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--t)}
.fg input{width:100%;padding:11px 14px;border:2px solid var(--b);border-radius:var(--rx);font-size:15px;transition:var(--tr);outline:none;background:var(--bg)}
.fg input:focus{border-color:var(--p);background:var(--c)}
.btn{width:100%;padding:12px;border:none;border-radius:var(--rx);font-size:15px;font-weight:600;cursor:pointer;transition:var(--tr)}
.btn-p{background:var(--p);color:#fff}
.btn-p:hover{background:var(--pd);transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,.35)}
.err{color:var(--d);font-size:13px;text-align:center;margin-top:8px;min-height:20px}

/* App Layout */
.app-screen{display:flex;flex-direction:column;min-height:100vh}
.app-header{background:var(--c);border-bottom:1px solid var(--b);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.03);position:sticky;top:0;z-index:100}
.app-logo{font-size:19px;font-weight:700;background:linear-gradient(135deg,var(--p),#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex-shrink:0}
.daily-quote{font-size:16px;color:var(--t);font-weight:700;font-family:"FangSong","仿宋","STFangsong","华文仿宋",serif;letter-spacing:.5px;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0}
.view-tabs{display:flex;gap:2px;background:var(--bg);border-radius:20px;padding:3px}
.view-tab{padding:6px 14px;border:none;border-radius:18px;cursor:pointer;font-size:12px;font-weight:500;transition:var(--tr);background:transparent;color:var(--ts)}
.view-tab.active{background:var(--c);color:var(--p);box-shadow:var(--sh)}
.user-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--p),#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.user-name{font-size:13px;font-weight:500;color:var(--t)}
.btn-logout{background:none;border:1px solid var(--b);padding:5px 12px;border-radius:16px;cursor:pointer;font-size:12px;color:var(--ts);transition:var(--tr)}
.btn-logout:hover{background:var(--dl);border-color:var(--d);color:var(--d)}

/* App Body */
.app-body{display:flex;gap:16px;padding:16px;max-width:1260px;margin:0 auto;width:100%;flex:1;min-height:0}
.calendar-sidebar{flex:0 0 268px;display:flex;flex-direction:column;background:var(--c);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;max-height:calc(100vh - 68px);position:sticky;top:68px}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--b)}
.cal-header button{width:28px;height:28px;border-radius:50%;border:1px solid var(--b);background:var(--c);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ts);transition:var(--tr)}
.cal-header button:hover{background:var(--pl);border-color:var(--p);color:var(--p)}
.cal-month-label{font-size:14px;font-weight:600}
.cal-day-labels{display:grid;grid-template-columns:repeat(7,1fr);padding:4px 10px 0}
.cal-day-label{text-align:center;font-size:10px;font-weight:600;color:var(--tm);padding:2px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:2px 10px 8px;gap:1px}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;transition:var(--tr);position:relative;font-size:12px;font-weight:500;color:var(--t)}
.cal-cell:hover{background:var(--bg)}
.cal-cell.other-month{color:var(--tm)}
.cal-cell.today{background:var(--pl);color:var(--p);font-weight:700}
.cal-cell.selected{background:var(--p);color:#fff;font-weight:700}
.cal-cell.today.selected{background:var(--p);color:#fff}
.cal-cell.range-date{box-shadow:inset 0 -2px 0 var(--w)}
.cal-cell.selected.range-date{box-shadow:inset 0 -2px 0 rgba(255,255,255,.6)}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--p);position:absolute;bottom:3px;left:50%;transform:translateX(-50%)}
.cal-cell.selected .cal-dot{background:#fff}
.cal-today-btn{display:block;width:calc(100% - 20px);margin:0 10px 8px;padding:7px;border:none;border-radius:var(--rx);cursor:pointer;font-size:11px;font-weight:600;background:var(--pl);color:var(--p);transition:var(--tr)}
.cal-today-btn:hover{background:var(--p);color:#fff}

/* Sidebar sections */
.side-section{border-top:1.5px solid var(--b);display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.side-section.habit-section{border-top:1.5px dashed var(--b);flex:0 0 auto;max-height:45%;min-height:60px;overflow:hidden;display:flex;flex-direction:column}
.side-section.habit-section .side-list{flex:1;overflow-y:auto;min-height:0;max-height:none}
.side-section-header{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:var(--bg);border-bottom:1px solid var(--b);flex-shrink:0}
.side-section-title{font-size:12px;font-weight:600;color:var(--t)}
.side-section-count{font-size:10px;color:var(--ts);background:var(--c);padding:2px 8px;border-radius:8px}
.side-list{flex:1;overflow-y:auto;min-height:0;padding:2px 0}
.side-list::-webkit-scrollbar{width:3px}
.side-list::-webkit-scrollbar-thumb{background:var(--b);border-radius:6px}
.side-item{display:flex;align-items:flex-start;gap:7px;padding:7px 10px;margin:2px 6px;border-radius:10px;transition:var(--tr);cursor:default}
.side-item:hover{filter:brightness(.96)}
.side-check{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:2px solid #cbd5e1;cursor:pointer;transition:var(--tr);display:flex;align-items:center;justify-content:center;font-size:10px;margin-top:1px}
.side-check:hover{border-color:var(--p);background:var(--pl)}
.side-check.done{background:var(--s);border-color:var(--s);color:#fff}
.side-body{flex:1;min-width:0}
.side-text{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-text.done{text-decoration:line-through;color:var(--tm)}
.side-meta{display:flex;align-items:center;gap:6px;margin-top:1px;font-size:10px;color:var(--ts);flex-wrap:wrap}
.side-deadline{font-weight:600}
.side-deadline.overdue{color:var(--d)}
.side-deadline.soon{color:var(--w)}
.side-progress{flex-shrink:0;width:36px;height:3px;background:rgba(255,255,255,.5);border-radius:2px;overflow:hidden;margin-top:4px}
.side-progress-bar{height:100%;border-radius:2px;transition:width .3s}
.side-del{flex-shrink:0;opacity:0;width:20px;height:20px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:var(--tm);font-size:13px;transition:var(--tr);display:flex;align-items:center;justify-content:center;margin-top:1px}
.side-item:hover .side-del{opacity:1}
.side-del:hover{background:var(--dl);color:var(--d)}

/* Habit item */
.habit-item{display:flex;align-items:center;gap:7px;padding:6px 10px;margin:2px 6px;border-radius:10px;transition:var(--tr)}
.habit-item:hover{filter:brightness(.96)}
.habit-check{flex-shrink:0;width:20px;height:20px;border-radius:6px;border:2px solid #cbd5e1;cursor:pointer;transition:var(--tr);display:flex;align-items:center;justify-content:center;font-size:11px}
.habit-check:hover{border-color:var(--p);background:var(--pl)}
.habit-check.done{background:var(--s);border-color:var(--s);color:#fff}
.habit-body{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.habit-text{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit-streak{font-size:10px;font-weight:600;color:var(--w);white-space:nowrap;flex-shrink:0}
.habit-streak.hot{color:var(--d)}
.habit-del{flex-shrink:0;opacity:0;width:20px;height:20px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:var(--tm);font-size:13px;transition:var(--tr);display:flex;align-items:center;justify-content:center}
.habit-item:hover .habit-del{opacity:1}
.habit-del:hover{background:var(--dl);color:var(--d)}
.habit-add{display:flex;gap:4px;padding:4px 10px 6px}
.habit-add input{flex:1;padding:6px 10px;border:1.5px dashed var(--b);border-radius:var(--rx);font-size:11px;outline:none;background:transparent;transition:var(--tr)}
.habit-add input:focus{border-color:var(--p);border-style:solid;background:var(--c)}
.habit-add button{padding:6px 12px;border:none;border-radius:var(--rx);cursor:pointer;font-size:11px;font-weight:600;background:var(--pl);color:var(--p);transition:var(--tr);white-space:nowrap}
.habit-add button:hover{background:var(--p);color:#fff}

/* Main Panel */
.main-panel{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--c);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--b);flex-shrink:0}
.panel-date{font-size:15px;font-weight:600}
.panel-nav{display:flex;align-items:center;gap:6px}
.panel-nav button{width:28px;height:28px;border-radius:50%;border:1px solid var(--b);background:var(--c);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ts);transition:var(--tr)}
.panel-nav button:hover{background:var(--pl);border-color:var(--p);color:var(--p)}
.nav-today{padding:5px 12px!important;border-radius:14px!important;width:auto!important;font-size:11px!important;font-weight:600}
.add-bar{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--b);flex-wrap:wrap;align-items:center;flex-shrink:0}
.add-mode-toggle{display:flex;gap:2px;background:var(--bg);border-radius:16px;padding:2px;flex-shrink:0}
.mode-tab{padding:5px 12px;border:none;border-radius:14px;cursor:pointer;font-size:11px;font-weight:500;transition:var(--tr);background:transparent;color:var(--ts);white-space:nowrap}
.mode-tab.active{background:var(--c);color:var(--p);box-shadow:var(--sh)}
.add-bar input[type="text"]{flex:1;min-width:120px;padding:8px 12px;border:2px solid var(--b);border-radius:var(--rx);font-size:13px;outline:none;transition:var(--tr);background:var(--bg)}
.add-bar input[type="text"]:focus{border-color:var(--p);background:var(--c)}
.add-bar input[type="time"],.add-bar input[type="date"]{padding:8px 10px;border:2px solid var(--b);border-radius:var(--rx);font-size:12px;outline:none;background:var(--bg);transition:var(--tr);flex-shrink:0}
.add-bar input[type="time"]:focus,.add-bar input[type="date"]:focus{border-color:var(--p)}
.range-inputs{display:flex;align-items:center;gap:4px}
.range-inputs span{color:var(--tm);font-size:12px}
.btn-add{padding:8px 18px;border:none;border-radius:var(--rx);cursor:pointer;font-size:13px;font-weight:600;background:var(--p);color:#fff;transition:var(--tr);white-space:nowrap;flex-shrink:0}
.btn-add:hover{background:var(--pd);box-shadow:0 3px 10px rgba(99,102,241,.3)}

/* Day Timeline */
.day-timeline{flex:1;overflow-y:auto;position:relative;min-height:0}
.day-timeline::-webkit-scrollbar{width:4px}
.day-timeline::-webkit-scrollbar-thumb{background:var(--b);border-radius:8px}
.time-now-line{position:absolute;left:0;right:0;height:2px;background:var(--d);z-index:2;pointer-events:none}
.time-now-line::before{content:'';position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--d)}
.timeline-hour{display:flex;border-bottom:1px solid var(--bg);min-height:52px;position:relative}
.timeline-hour:hover{background:#fafbfd}
.hour-label{flex:0 0 48px;padding:6px 6px 0 0;text-align:right;font-size:10px;color:var(--tm);font-weight:500}
.hour-content{flex:1;padding:3px 6px;display:flex;flex-wrap:wrap;gap:3px;align-items:flex-start;align-content:flex-start;cursor:pointer;min-height:30px}
.hour-content:hover{background:var(--pl)}

/* Check-in strip in day view */
.day-checks{display:flex;flex-wrap:wrap;gap:4px;padding:6px 12px;border-bottom:1px solid var(--b);background:#fffbeb}
.day-checks-label{font-size:10px;font-weight:600;color:var(--w);flex-shrink:0;display:flex;align-items:center;gap:2px;padding:2px 0}
.day-check-chip{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500;cursor:pointer;transition:var(--tr);border:1.5px solid var(--b);background:var(--c)}
.day-check-chip:hover{border-color:var(--s);background:var(--sl)}
.day-check-chip.done{background:var(--sl);border-color:var(--s);color:var(--s)}
.day-check-chip .dc-dot{font-size:10px}

/* Week Timetable */
.week-timetable{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.week-timetable::-webkit-scrollbar{width:4px;height:4px}
.week-timetable::-webkit-scrollbar-thumb{background:var(--b);border-radius:8px}
.tt-grid{display:grid;grid-template-columns:48px repeat(7,minmax(70px,1fr));min-width:580px;font-size:11px;flex:1}
.tt-header-cell{text-align:center;padding:8px 2px;border-bottom:2px solid var(--b);font-weight:600;background:var(--bg);position:sticky;top:0;z-index:1}
.tt-header-cell.today{color:var(--p);background:var(--pl)}
.tt-dow{font-size:11px}.tt-date{font-size:10px;color:var(--ts)}
.tt-time-cell{text-align:right;padding:4px 5px 0 0;font-size:9px;color:var(--tm);border-bottom:1px solid var(--bg);font-weight:500}
.tt-cell{border-bottom:1px solid var(--bg);padding:2px;min-height:40px;cursor:pointer;transition:var(--tr);display:flex;flex-wrap:wrap;gap:1px;align-content:flex-start}
.tt-cell:hover{background:var(--pl)}
.tt-cell.today-col{background:#fafaff}
.tt-cell .task-block{font-size:9px;padding:2px 3px;border-radius:3px;max-width:100%}

/* Task Block */
.task-block{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:14px;font-size:13px;cursor:default;transition:var(--tr);animation:fadeIn .25s ease;max-width:100%}
.task-block:hover{filter:brightness(.94)}
.task-block.done{opacity:.5}
.task-block.done .tb-text{text-decoration:line-through}
.tb-time{font-size:10px;opacity:.7;flex-shrink:0;font-weight:500}
.tb-check{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;transition:var(--tr)}
.tb-check:hover{background:var(--s);border-color:var(--s);color:#fff}
.task-block.done .tb-check{background:var(--s);border-color:var(--s);color:#fff}
.tb-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-del{opacity:0;cursor:pointer;font-size:13px;font-weight:700;color:var(--tm);flex-shrink:0;transition:var(--tr);line-height:1}
.task-block:hover .tb-del{opacity:1}
.tb-del:hover{color:var(--d)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}

/* Week range bars */
.week-range-bar{grid-column:1/-1;padding:6px 10px;background:var(--wl);border-top:1px solid #fde68a;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.week-range-bar .wr-label{font-size:10px;font-weight:600;color:var(--ts);width:100%}
.week-range-chip{display:inline-flex;align-items:center;gap:4px;background:var(--c);padding:3px 10px;border-radius:12px;font-size:10px;box-shadow:var(--sh)}
.week-range-chip .wrc-bar{height:3px;border-radius:2px;min-width:24px}
.week-range-chip .wrc-text{font-weight:500;max-width:100px;overflow:hidden;text-overflow:ellipsis}
.week-range-chip .wrc-dates{color:var(--ts)}
.week-range-chip .wrc-deadline{font-weight:600}
.week-range-chip .wrc-deadline.soon{color:var(--w)}
.week-range-chip .wrc-deadline.overdue{color:var(--d)}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;color:var(--tm);text-align:center}
.empty-icon{font-size:36px;margin-bottom:8px;opacity:.5}
.empty-text{font-size:13px;margin-bottom:2px}
.empty-hint{font-size:11px}

/* Floating Animation */
.float-layer{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}
.float-bubble{position:absolute;display:flex;align-items:center;gap:5px;background:var(--c);padding:8px 14px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.15);font-size:13px;font-weight:600;white-space:nowrap;animation:floatUp 2.5s ease-out forwards}
.float-bubble .fb-emoji{font-size:18px}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.8)}15%{opacity:1;transform:translateY(-8px) scale(1.05)}30%{opacity:1;transform:translateY(-25px) scale(1)}100%{opacity:0;transform:translateY(-120px) scale(.9)}}
.particle{position:absolute;width:7px;height:7px;border-radius:50%;animation:particleFly 1.1s ease-out forwards}
@keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--px),var(--py)) scale(0)}}

/* Responsive */
@media(max-width:900px){
  .app-body{flex-direction:column;padding:8px;gap:8px}
  .calendar-sidebar{flex:0 0 auto;max-height:none;position:static;border-radius:var(--rs)}
  .cal-cell{font-size:11px}
  .daily-quote{font-size:13px}
  .side-section{max-height:200px;flex:0 0 auto}
  .side-section.habit-section{max-height:160px}
}
@media(max-width:600px){
  .auth-card{padding:24px 16px}
  .app-header{padding:8px 10px;gap:4px}
  .app-logo{font-size:15px}
  .daily-quote{font-size:11px}
  .header-right{gap:6px}
  .view-tab{padding:4px 8px;font-size:10px}
  .add-bar{padding:6px 10px;gap:4px}
  .add-bar input[type="text"]{min-width:80px;font-size:12px;padding:6px 8px}
  .add-bar input[type="time"],.add-bar input[type="date"]{font-size:11px;padding:6px 6px}
  .mode-tab{padding:4px 8px;font-size:10px}
  .btn-add{padding:6px 12px;font-size:11px}
  .panel-header{padding:8px 10px}
  .panel-date{font-size:12px}
  .timeline-hour{min-height:44px}
  .hour-label{flex:0 0 36px;font-size:9px}
  .side-item{padding:6px 8px;gap:5px}
  .side-text{font-size:11px}
  .habit-item{padding:5px 8px;gap:5px}
  .side-section.habit-section{max-height:160px}
}
</style>
</head>
<body>

<!-- Auth -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>📋 待办清单</h1>
    <p class="sub">时间管理 · 高效每一天</p>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">登录</button>

// Helpers
function todayStr(){const d=new Date();return fmtDate(d);}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseDate(s){const[p,m,d]=s.split('-').map(Number);return new Date(p,m-1,d);}
function isToday(s){return s===todayStr();}
function getMonday(d){const c=new Date(d);const day=c.getDay();const diff=day===0?-6:1-day;c.setDate(c.getDate()+diff);c.setHours(0,0,0,0);return c;}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function shuffleArray(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getNextQuote(){if(quoteIdx>=shuffledQuotes.length){shuffledQuotes=shuffleArray(QUOTES);quoteIdx=0;}return shuffledQuotes[quoteIdx++];}
function hashColor(str,palette){let h=0;for(let i=0;i<str.length;i++)h=((h<<5)-h)+str.charCodeAt(i)|0;return palette[Math.abs(h)%palette.length];}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function fmtDateCN(s){const d=parseDate(s);return d.getMonth()+1+'月'+d.getDate()+'日';}

// Auth
function showError(msg){document.getElementById('authError').textContent=msg;}
function clearError(){document.getElementById('authError').textContent='';}
// One account identity is shared by registration and login. This prevents
// visually equivalent names (for example, "Alice", " alice ", and "Ａｌｉｃｅ")
// from being registered as separate users.
function normalizeUsername(username){return String(username||'').normalize('NFKC').trim().toLocaleLowerCase();}
function doRegister(u,p,p2){
  const username=String(u||'').normalize('NFKC').trim();
  const usernameKey=normalizeUsername(username);
  if(!username){showError('请输入用户名');return false;}
  if(username.length<2){showError('用户名至少2个字符');return false;}
  if(p.length<4){showError('密码至少4位');return false;}
  if(p!==p2){showError('两次密码不一致');return false;}
  const users=getUsers();
  if(users.find(x=>(x.usernameKey||normalizeUsername(x.username))===usernameKey)){showError('用户名已存在');return false;}
  users.push({username,password:p,usernameKey});saveUsers(users);return true;
}
function doLogin(u,p){
  const usernameKey=normalizeUsername(u);
  if(!usernameKey||!p){showError('请填写用户名和密码');return null;}
  const user=getUsers().find(x=>(x.usernameKey||normalizeUsername(x.username))===usernameKey&&x.password===p);
  if(!user){showError('用户名或密码错误');return null;}
  return user;
}

  currentUser=user;saveSession(user);
  shuffledQuotes=shuffleArray(QUOTES);quoteIdx=0;
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  document.getElementById('userAvatar').textContent=user.username.charAt(0).toUpperCase();
  document.getElementById('userNameDisplay').textContent=user.username;
  document.getElementById('dailyQuote').textContent=DAILY_QUOTES[Math.floor(Math.random()*DAILY_QUOTES.length)];
  const t=todayStr();selectedDate=t;calYear=new Date().getFullYear();calMonth=new Date().getMonth();
  weekStart=getMonday(new Date());currentView='day';addMode='point';
  document.querySelector('.view-tab[data-view="day"]').classList.add('active');
  document.querySelector('.view-tab[data-view="week"]').classList.remove('active');
  document.querySelector('.mode-tab[data-mode="point"]').classList.add('active');
  document.querySelector('.mode-tab[data-mode="range"]').classList.remove('active');
  renderAll();setTimeout(scrollToNow,150);
}
function logout(){
  currentUser=null;selectedDate=null;localStorage.removeItem(STORAGE_SESSION);
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  ['loginUser','loginPass','regUser','regPass','regPass2'].forEach(id=>document.getElementById(id).value='');
  clearError();
  document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector('[data-tab="login"]').classList.add('active');
  document.getElementById('loginForm').classList.remove('hidden');
  document.getElementById('registerForm').classList.add('hidden');
}

function getPointDatesSet(){
  if(!currentUser)return new Set();
  const data=getAllTodos();
  return new Set(Object.keys(data).filter(k=>Array.isArray(data[k])&&data[k].length>0));
}
function getRangeDatesSet(){
  if(!currentUser)return new Set();
  const dates=new Set();
  for(const t of getRangeTodos()){if(t.done)continue;const s=parseDate(t.startDate),e=parseDate(t.endDate);for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1))dates.add(fmtDate(d));}
  return dates;
}
function getActiveRangeTasks(dateStr){
  return getRangeTodos().filter(t=>!t.done&&t.startDate<=dateStr&&t.endDate>=dateStr);
}
function renderCalendarSidebar(){
  const grid=document.getElementById('calGrid'),label=document.getElementById('calMonthLabel');
  const pointDates=getPointDatesSet(),rangeDates=getRangeDatesSet();
  label.textContent=`${calYear}年 ${calMonth+1}月`;
  const firstDay=new Date(calYear,calMonth,1),lastDay=new Date(calYear,calMonth+1,0);
  const daysInMonth=lastDay.getDate(),startCol=(firstDay.getDay()+6)%7;
  const totalCells=Math.ceil((startCol+daysInMonth)/7)*7;
  const prevLast=new Date(calYear,calMonth,0).getDate();
  let html='';
  for(let i=0;i<totalCells;i++){
    let dateNum,dateStr,cls='cal-cell';
    if(i<startCol){dateNum=prevLast-startCol+i+1;dateStr=fmtDate(new Date(calYear,calMonth-1,dateNum));cls+=' other-month';}
    else if(i>=startCol+daysInMonth){dateNum=i-startCol-daysInMonth+1;dateStr=fmtDate(new Date(calYear,calMonth+1,dateNum));cls+=' other-month';}
    else{dateNum=i-startCol+1;dateStr=fmtDate(new Date(calYear,calMonth,dateNum));}
    if(isToday(dateStr))cls+=' today';
    if(dateStr===selectedDate)cls+=' selected';
    if(rangeDates.has(dateStr))cls+=' range-date';
    html+=`<div class="${cls}" data-date="${dateStr}">${dateNum}${pointDates.has(dateStr)?'<div class="cal-dot"></div>':''}</div>`;
  }
  grid.innerHTML=html;
}

// Day Timeline
function renderDayTimeline(){
  const container=document.getElementById('dayView'),today=todayStr();
  const todos=getTodosForDate(selectedDate);
  const byHour={};for(let h=START_HOUR;h<=END_HOUR;h++)byHour[h]=[];
  for(const t of todos){
    const h=parseInt(t.time.split(':')[0],10);
    if(h>=START_HOUR&&h<=END_HOUR)byHour[h].push(t);
    else if(h<START_HOUR)byHour[START_HOUR].push(t);
    else byHour[END_HOUR].push(t);
  }
  const now=new Date();let nowPct=null;
  if(selectedDate===today){
    const nowH=now.getHours(),nowM=now.getMinutes();
    const startMin=START_HOUR*60,endMin=(END_HOUR+1)*60,nowMin=nowH*60+nowM;
    if(nowMin>=startMin&&nowMin<=endMin)nowPct=((nowMin-startMin)/(endMin-startMin))*100;
  }
  let html='';
  if(nowPct!==null)html+=`<div class="time-now-line" style="top:${nowPct}%"></div>`;
  for(let h=START_HOUR;h<=END_HOUR;h++){
    const hl=String(h).padStart(2,'0')+':00';
    html+=`<div class="timeline-hour" data-hour="${h}"><div class="hour-label">${hl}</div><div class="hour-content" data-hour="${h}">`;
    for(const t of byHour[h]){
      const color=t.color||hashColor(t.text,TASK_PALETTE);
      html+=`<div class="task-block${t.done?' done':''}" data-id="${t.id}" style="background:${color}"><span class="tb-time">${t.time}</span><span class="tb-check" data-action="toggle">${t.done?'✓':''}</span><span class="tb-text">${escapeHtml(t.text)}</span><span class="tb-del" data-action="delete">×</span></div>`;
    }
    html+=`</div></div>`;
  }
  const st=container.scrollTop;
  container.innerHTML=html;
  container.scrollTop=st;
}
function scrollToNow(){
  if(selectedDate!==todayStr())return;
  const container=document.getElementById('dayView'),nowH=new Date().getHours();
  if(nowH<START_HOUR||nowH>END_HOUR)return;
  const rows=container.querySelectorAll('.timeline-hour');
  if(rows[nowH-START_HOUR])rows[nowH-START_HOUR].scrollIntoView({behavior:'smooth',block:'center'});
}

// Day check-in strip
function renderDayChecks(){
  const strip=document.getElementById('dayChecks'),habits=getHabits(),today=todayStr();
  if(habits.length===0){strip.classList.add('hidden');strip.innerHTML='';return;}
  strip.classList.remove('hidden');
  strip.innerHTML='<span class="day-checks-label">🔥 今日打卡</span>'+habits.map(h=>{
    const done=h.completions&&h.completions[today];
    const bg=h.color||hashColor(h.text,HABIT_PALETTE);
    return `<div class="day-check-chip${done?' done':''}" data-hid="${h.id}" style="${done?'':'background:'+bg+'40'}"><span class="dc-dot">${done?'✅':'☐'}</span>${escapeHtml(h.text)}</div>`;
  }).join('');
}

// Week Timetable
function renderWeekTimetable(){
  const container=document.getElementById('weekView'),mon=weekStart,today=todayStr();
  const dayNames=['一','二','三','四','五','六','日'];
  const weekTodos=[];
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const ds=fmtDate(d);weekTodos.push({date:ds,day:d.getDate(),month:d.getMonth()+1,todos:getTodosForDate(ds)});}
  let hdr='<div class="tt-header-cell" style="grid-column:1">时间</div>';
  for(let i=0;i<7;i++){const wt=weekTodos[i];hdr+=`<div class="tt-header-cell${wt.date===today?' today':''}"><div class="tt-dow">周${dayNames[i]}</div><div class="tt-date">${wt.month}/${wt.day}</div></div>`;}
  let body='';
  for(let h=START_HOUR;h<=END_HOUR;h++){
    body+=`<div class="tt-time-cell">${String(h).padStart(2,'0')}:00</div>`;
    for(let d=0;d<7;d++){
      const ds=weekTodos[d].date;
      const hourTodos=weekTodos[d].todos.filter(t=>parseInt(t.time.split(':')[0],10)===h);
      body+=`<div class="tt-cell${ds===today?' today-col':''}" data-date="${ds}" data-hour="${h}">`;
      for(const t of hourTodos){
        const color=t.color||hashColor(t.text,TASK_PALETTE);
        body+=`<div class="task-block${t.done?' done':''}" data-id="${t.id}" style="background:${color}"><span class="tb-time">${t.time}</span><span class="tb-check" data-action="toggle">${t.done?'✓':''}</span><span class="tb-text">${escapeHtml(t.text)}</span><span class="tb-del" data-action="delete">×</span></div>`;
      }
      body+=`</div>`;
    }
  }
  // Range bars
  let rangeHtml='';
  const weekRangeTasks=getRangeTodos().filter(t=>!t.done).filter(t=>{const ts=parseDate(t.startDate),te=parseDate(t.endDate);const we=new Date(mon);we.setDate(mon.getDate()+6);return ts<=we&&te>=mon;});
  if(weekRangeTasks.length>0){
    rangeHtml='<div class="week-range-bar"><span class="wr-label">📅 时间段任务</span>';
    for(const rt of weekRangeTasks){
      const barColor=rt.color||hashColor(rt.text,RANGE_PALETTE);
      const dateLabel=rt.startDate===rt.endDate?fmtDateCN(rt.startDate):`${fmtDateCN(rt.startDate)}→${fmtDateCN(rt.endDate)}`;
      const remaining=Math.max(0,Math.ceil((parseDate(rt.endDate)-parseDate(today))/86400000)+1);
      const overdue=today>rt.endDate;
      rangeHtml+=`<div class="week-range-chip"><span class="wrc-bar" style="background:${barColor};width:${Math.min(50,Math.max(20,rt.endDate===rt.startDate?20:36))}px"></span><span class="wrc-text">${escapeHtml(rt.text)}</span><span class="wrc-dates">${dateLabel}</span><span class="wrc-deadline${overdue?' overdue':remaining<=2?' soon':''}">${overdue?'超期':remaining+'天'}</span></div>`;
    }
    rangeHtml+='</div>';
  }
  container.innerHTML=`<div class="tt-grid">${hdr}${body}${rangeHtml}</div>`;
}

// Range Tasks Section
function renderRangeSection(){
  const listEl=document.getElementById('rangeList'),countEl=document.getElementById('rangeCount');
  const all=getRangeTodos(),active=all.filter(t=>!t.done),done=all.filter(t=>t.done);
  const today=todayStr();
  active.sort((a,b)=>a.endDate.localeCompare(b.endDate));
  done.sort((a,b)=>b.endDate.localeCompare(a.endDate));
  const display=[...active,...done];
  countEl.textContent=active.length+'个';
  if(display.length===0){
    listEl.innerHTML=`<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-text">暂无时间段任务</div><div class="empty-hint">切换模式到"时间段"添加</div></div>`;
  }else{
    listEl.innerHTML=display.map(t=>{
      const startD=parseDate(t.startDate),endD=parseDate(t.endDate);
      const totalDays=Math.max(1,Math.ceil((endD-startD)/86400000)+1);
      const elapsed=Math.max(0,Math.ceil((parseDate(today)-startD)/86400000)+1);
      const pct=Math.min(100,Math.round((elapsed/totalDays)*100));
      const remaining=Math.max(0,Math.ceil((endD-parseDate(today))/86400000)+1);
      let dlCls='',dlLabel='';
      if(!t.done){if(today>t.endDate){dlCls='overdue';dlLabel='超期';}else if(remaining<=2){dlCls='soon';dlLabel=remaining+'天';}else{dlLabel=remaining+'天';}}
      const isSame=t.startDate===t.endDate;
      const dateStr=isSame?`📌 ${fmtDateCN(t.startDate)}`:`${fmtDateCN(t.startDate)} → ${fmtDateCN(t.endDate)}`;
      const barColor=t.color||hashColor(t.text,RANGE_PALETTE);
      const bg=t.done?`background:var(--bg);opacity:.6`:`background:${barColor}40`;
      return `<div class="side-item" data-rid="${t.id}" style="${bg}">
        <div class="side-check${t.done?' done':''}" data-action="rangeToggle">${t.done?'✓':''}</div>
        <div class="side-body"><div class="side-text${t.done?' done':''}">${escapeHtml(t.text)}</div><div class="side-meta"><span>${dateStr}</span>${!t.done?`<span class="side-deadline ${dlCls}">${dlLabel}</span><span>${pct}%</span>`:''}</div></div>
        ${!t.done?`<div class="side-progress"><div class="side-progress-bar" style="width:${pct}%;background:${barColor}"></div></div>`:''}
        <button class="side-del" data-action="rangeDelete">×</button></div>`;
    }).join('');
  }
}

// Habit Section
function getStreak(habit){
  const today=new Date();let streak=0;
  for(let i=0;;i++){const d=new Date(today);d.setDate(d.getDate()-i);const ds=fmtDate(d);if(habit.completions&&habit.completions[ds])streak++;else break;}
  return streak;
}
function renderHabitSection(){
  const listEl=document.getElementById('habitList'),countEl=document.getElementById('habitCount');
  const habits=getHabits(),today=todayStr();
  countEl.textContent=habits.length+'个';
  if(habits.length===0){
    listEl.innerHTML=`<div class="empty-state"><div class="empty-icon">🔥</div><div class="empty-text">暂无打卡习惯</div><div class="empty-hint">在下方添加每日打卡</div></div>`;
  }else{
    listEl.innerHTML=habits.map(h=>{
      const done=h.completions&&h.completions[today];
      const streak=getStreak(h);
      const bg=h.color||hashColor(h.text,HABIT_PALETTE);
      return `<div class="habit-item" style="background:${bg}40">
        <div class="habit-check${done?' done':''}" data-action="habitToggle" data-hid="${h.id}">${done?'✓':''}</div>
        <div class="habit-body"><span class="habit-text">${escapeHtml(h.text)}</span>${streak>0?`<span class="habit-streak${streak>=7?' hot':''}">🔥${streak}天</span>`:''}</div>
        <button class="habit-del" data-action="habitDelete" data-hid="${h.id}">×</button></div>`;
    }).join('');
  }
}

// Render All
function renderAll(){
  renderCalDayLabels();renderCalendarSidebar();
  const d=parseDate(selectedDate),wd=['日','一','二','三','四','五','六'];
  document.getElementById('panelDate').textContent=`${d.getFullYear()}年 ${d.getMonth()+1}月${d.getDate()}日 星期${wd[d.getDay()]}`;

// Actions
function selectDate(dateStr){
  selectedDate=dateStr;const d=parseDate(dateStr);
  if(currentView==='week'){const mon=getMonday(d);if(!sameDay(mon,weekStart))weekStart=mon;}
  calYear=d.getFullYear();calMonth=d.getMonth();
  document.getElementById('rangeStart').value=dateStr;document.getElementById('rangeEnd').value=dateStr;
  document.getElementById('dailyQuote').textContent=DAILY_QUOTES[Math.floor(Math.random()*DAILY_QUOTES.length)];
  renderAll();
  if(currentView==='day'&&selectedDate===todayStr())setTimeout(scrollToNow,150);
}
function addTodo(){
  const input=document.getElementById('todoInput'),text=input.value.trim();
  if(!text)return;
  if(addMode==='point'){
    const time=document.getElementById('todoTime').value||'09:00';
    const todos=getTodosForDate(selectedDate);
    todos.push({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),text,time,done:false,color:hashColor(text+time,TASK_PALETTE),createdAt:new Date().toISOString()});
    todos.sort((a,b)=>a.time.localeCompare(b.time));setTodosForDate(selectedDate,todos);
  }else{
    const sd=document.getElementById('rangeStart').value||selectedDate,ed=document.getElementById('rangeEnd').value||selectedDate;
    if(sd>ed){alert('结束日期不能早于开始日期');return;}
    const rangeTodos=getRangeTodos();
    rangeTodos.push({id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),text,startDate:sd,endDate:ed,done:false,color:hashColor(text+sd,RANGE_PALETTE),createdAt:new Date().toISOString()});
    rangeTodos.sort((a,b)=>a.endDate.localeCompare(b.endDate));saveRangeTodos(rangeTodos);
  }
  input.value='';renderAll();input.focus();
}
function addHabit(){
  const input=document.getElementById('habitInput'),text=input.value.trim();
  if(!text)return;
  const habits=getHabits();
  habits.push({id:'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),text,color:hashColor(text,HABIT_PALETTE),completions:{},createdAt:new Date().toISOString()});
  saveHabits(habits);input.value='';renderAll();
}
function toggleTodo(id){
  const data=getAllTodos();let found=null,foundDate=null;
  for(const[ds,todos]of Object.entries(data)){const t=todos.find(x=>x.id===id);if(t){found=t;foundDate=ds;break;}}
  if(!found)return;
  found.done=!found.done;setTodosForDate(foundDate,data[foundDate]);
  if(found.done)triggerAnimation(id);
  renderAll();
}
function deleteTodo(id){
  const data=getAllTodos();
  for(const[ds,todos]of Object.entries(data)){const idx=todos.findIndex(x=>x.id===id);if(idx!==-1){todos.splice(idx,1);setTodosForDate(ds,todos);renderAll();return;}}
}
function toggleRangeTodo(id){
  const all=getRangeTodos(),t=all.find(x=>x.id===id);
  if(!t)return;t.done=!t.done;saveRangeTodos(all);
  if(t.done)triggerAnimation(id);
  renderAll();
}
function deleteRangeTodo(id){
  const all=getRangeTodos(),idx=all.findIndex(x=>x.id===id);
  if(idx!==-1){all.splice(idx,1);saveRangeTodos(all);renderAll();}
}
function toggleHabit(id){
  const habits=getHabits(),h=habits.find(x=>x.id===id);
  if(!h)return;
  if(!h.completions)h.completions={};
  const today=todayStr();
  if(h.completions[today]){delete h.completions[today];}
  else{h.completions[today]=true;triggerAnimation(id);}
  saveHabits(habits);renderAll();
}
function deleteHabit(id){
  const habits=getHabits(),idx=habits.findIndex(x=>x.id===id);
  if(idx!==-1){habits.splice(idx,1);saveHabits(habits);renderAll();}
}
function triggerAnimation(id){
  let cx=lastClickX,cy=lastClickY;
  if(cx==null){
    const el=document.querySelector(`.task-block[data-id="${id}"],.side-item[data-rid="${id}"],.habit-item [data-hid="${id}"],.day-check-chip[data-hid="${id}"]`);
    if(el){const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top;}
    else{cx=window.innerWidth/2;cy=window.innerHeight/3;}
  }
  spawnFloatAnimation(cx,cy);
  lastClickX=null;lastClickY=null;
}

// Floating Animation
function spawnFloatAnimation(cx,cy){
  const layer=document.getElementById('floatLayer'),quote=getNextQuote();
  const bubble=document.createElement('div');bubble.className='float-bubble';
  const emojiMatch=quote.match(/([\p{Emoji_Presentation}\p{Emoji}\u{200D}]+)\s*$/u);
  const emoji=emojiMatch?emojiMatch[1]:'👍';
  const text=emojiMatch?quote.slice(0,-emojiMatch[0].length).trim():quote;
  bubble.innerHTML=`<span class="fb-emoji">${emoji}</span><span>${text||quote}</span>`;
  bubble.style.left=cx+'px';bubble.style.top=cy+'px';bubble.style.transform='translate(-50%,-100%)';
  layer.appendChild(bubble);
  setTimeout(()=>{if(bubble.parentNode)bubble.remove();},2600);
  const colors=['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4'];
  for(let i=0;i<7;i++){
    const p=document.createElement('div');p.className='particle';
    p.style.left=cx+'px';p.style.top=cy+'px';p.style.background=colors[Math.floor(Math.random()*colors.length)];
    const angle=(Math.PI*2/7)*i+Math.random()*.4,dist=25+Math.random()*50;
    p.style.setProperty('--px',Math.cos(angle)*dist+'px');p.style.setProperty('--py',Math.sin(angle)*dist-15+'px');
    layer.appendChild(p);setTimeout(()=>{if(p.parentNode)p.remove();},1200);
  }
}
